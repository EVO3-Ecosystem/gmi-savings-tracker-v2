[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmi-savings-tracker"
version = "0.1.0"
description = "GMI Savings Tracker: local SODA -> Parquet -> DuckDB pipeline that checks reported savings against Maryland's own payments and finds the next $50M"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["sodapy>=2.2", "pandas>=2.0", "pyarrow>=14", "pyyaml>=6", "requests>=2.31", "duckdb>=1.0", "pdfplumber>=0.11", "matplotlib>=3.8", "scikit-learn>=1.3", "lightgbm>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
preview = ["playwright>=1.40"]

[tool.setuptools]
packages = ["src", "src.pipeline", "src.models"]

[tool.ruff]
line-length = 160
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
