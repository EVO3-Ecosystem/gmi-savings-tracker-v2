# Assumptions behind the forecasts (src/models/forecast.py). Change a value here, not in code.

forecast:
  first_actual_fy: 2017        # the series starts here (earlier years are not in the operating budget data)
  last_actual_fy: 2025         # last year with a confirmed actual; later years are the State's own plan, never used to fit
  horizon_fy: 2031             # forecast through this fiscal year
  bootstrap_paths: 4000        # simulated paths per area for the p10 / p50 / p90 range
  seed: 11                     # fixed so a rebuild reproduces the same ranges
  selection: rolling_origin_mase  # method choice: lowest mean MASE over the rolling origins (legacy_single_split = the legacy rule)
  selection_fit_end_fy: 2022   # legacy rule only: fit through this year, score the years after it
  rolling_min_train_years: 5   # rolling-origin backtest: smallest training window
  rolling_max_horizon: 3       # rolling-origin backtest: longest horizon scored from each origin
  backtest_bootstrap_paths: 500   # paths per origin for the backtest's ranges (the published forecasts use bootstrap_paths)
  rolling_score_through_fy: 2027  # years up to the last actual are scored against actuals; later years against the State's plan

# GMI's recurring savings by focus area (Joint Chairmen's Report, Jan 26, 2026): the middle of each reported range,
# summed over the saving IDs listed (see reference/gmi_reported_savings.csv). Areas not listed get no default rate.
gmi_recurring:
  "Fleet & fuel":
    savings: [S08, S09]
    note: "fuel and maintenance $0.8M + maintenance vendors $1.3M"
  "Telecom":
    savings: [S10, S11, S12]
    note: "phone lines $0.5M + plan catalog $2.1-2.3M + copper lines $1.4-1.7M"
  "IT hardware, software & services":
    savings: [S13, S14, S15]
    note: "laptop refresh $1.5M + specifications $1.5M + pricing $1.9M"
  "Print, copy & mail":
    savings: [S16]
    note: "shipping contract $0.8M"
  "Other controllable purchases":
    savings: [S01]
    note: "contract renegotiation $18M year over year"

# Agencies left out of every GMI savings baseline (opportunity detectors, bid list, vendor moves). Public higher education
# (4mca-332u) buys outside the executive-branch procurement GMI works through; only R95 also appears in the payments data.
# Its budget is shown only in mart.d_all_funds, labeled "including public higher education". (Statute citations: to verify.)
gmi_baseline_exclusions:
  agency_codes: [R13, R14, R30, R95]

# Screening assumptions for the opportunity detectors (src/models/opportunities.py), carried over from the legacy
# pipeline. The saving rates are screening percentages, not forecasts: see the Assumptions register in
# docs/data-governance.md. Change a value here, not in code.
opportunities:
  current_fy: 2025             # budget detectors look at this actual year ...
  base_fy: 2022                # ... and, for growth, compare it with this one
  payments_fy: 2026            # payment detectors (tail spend, leverage, bid list) use this year
  peer_gap:
    min_positions: 50          # agencies with fewer budgeted positions are not compared
    min_agencies: 8            # a spending code needs this many comparable agencies
    min_budget: 250000         # ignore findings smaller than this
    percentile: 0.75           # spending per position above this percentile of peer agencies
    share_low: 0.05            # saving = this share of the excess above the percentile ...
    share_high: 0.15
    cap_low: 0.03              # ... but at most this share of the agency's spending on the code
    cap_high: 0.10
  growth:
    points_above_state: 0.25   # grew this many points faster than the state's spending on the same code
    min_budget: 500000
    min_base_budget: 1000000   # the prior-year spending must exceed this (0 = the legacy rule: any positive base). $1M drops lines that jump from a few thousand dollars (likely re-coding)
    share_low: 0.10            # saving = this share of the growth above the state's pace
    share_high: 0.30
  tail_spend:
    top_vendors: 10            # vendors outside the largest N in a focus area
    min_tail: 1000000
    rate_low: 0.03
    rate_high: 0.10
  leverage:
    min_agencies: 10           # one vendor paid separately by this many agencies
    min_spend: 5000000
    rate_low: 0.02
    rate_high: 0.05
  bid_list:
    min_agencies: 10
    min_spend: 5000000
    rate_low: 0.02
    rate_high: 0.05
    excluded_agency_codes: [CAPITAL, D06, D25]
    not_biddable: "CONSTRUCT|PAVING|CONTRACTING|MCO|HEALTH|TRUST|BANK|SCHOOL|ACADEMY|UNIVERSITY|COLLEGE|HOSPITAL|COUNTY|CITY OF|\\bJV\\b|BUS|INSURANCE|ROOF|MECHANICAL|ENGINEERS|TITLE|RESCUE|BUILDERS|EXCAVAT|BRIDGE|STEEL|CONCRETE|YESHIVA|TALMUD|HOME OF|ARC OF|COUNCIL|CHARIT|SHELTER|FAMILY|YOUTH|COMMUNITY|SERVICES FOR|CENTER FOR|SOCIETY|FOUNDATION|ASSOCIATION|BALTIMORE GAS|PEPCO|POTOMAC ELECTRIC|DELMARVA|POTOMAC EDISON|WASHINGTON GAS LIGHT|SCHLOSSER|MYERS|ZIMMER|CHRISTMAN"

# Savings checks (src/models/savings.py): GMI's reported savings paired with the payments that would show them.
savings:
  first_fy: 2022               # payments considered from this fiscal year
  before_fy: 2025              # a check compares payments in this year ...
  after_fy: 2026               # ... with this year
  seen_share: 0.5              # "Seen" when payments fell by at least this share of the reported saving
  counted_status: [Saved in FY2026, Under way]   # only these items' amounts are measured against payments; projected ones are not due yet
  vendor_moves:
    years: [2024, 2025, 2026]  # the three years shown; the last two are compared
    min_agencies: 5            # GMI renegotiated statewide procurement contracts: vendors paid by this many agencies
    min_before: 1000000        # and paid at least this in the earlier year
    top: 40                    # the largest decreases shown
    excluded_agency_codes: [CAPITAL, D06, D25, R13, R14, R30, R95]   # operating spending only; public higher education out of GMI baselines
    not_procurement: "CONSTRUCT|PAVING|CONTRACTING|MCO|HEALTH PLAN|PARTNERS MCO|TRUST|BANK|SCHOOL|ACADEMY|UNIVERSITY|COLLEGE|HOSPITAL|COUNTY|CITY OF|\\bJV\\b|BUS SALES|NOVA BUS|INSURANCE|MEDICAL CENTER|YESHIVA|TALMUD|BNOS|ROOF|MECHANICAL|CORPS OF ENGINEERS|HEALTH|TITLE|RESCUE|BUILDERS|EXCAVAT|BRIDGE|STEEL|CONCRETE|HOME OF|\\bARC OF|BOYS & GIRLS|EASTER SEALS|GOODWILL|HUMANIM|INSTITUTIONS & ALTERNATIVES|STAR COMMUNITY|SHORE UP|MARITIME ADV TRAINING"   # last group: health and human-service non-profits, which the payments data does not flag

# Recommendations (src/models/recommendations.py): the Overview's six recommendations as tracked tables.
recommendations:
  target_saving: 50000000      # the path to this many dollars a year
  matched_fy: 2026             # recommendation 5 reports the share of this year's payments matched to an agency
  vendor_detail:
    first_fy: 2022             # drill-down tables from this year
    names_fy: 2026             # payee names merged into a vendor, by this year's payments
  plan:
    forecast_fy: 2027          # step 1 applies GMI's reported rates to this year's forecast median
    contract_rate: 0.035       # assumed saving on a statewide contract (assumed range 2-5%)
    contract_rate_low: 0.02    # the plan's low case: the bottom of that range
    contract_rate_high: 0.05   # the plan's high case: the top of that range
    fallback_rate: 0.01        # assumed saving in the fallback areas if the contracts fall short
    fallback_rate_low: 0.005   # low and high cases for the fallback areas (a judgement, like the rate itself)
    fallback_rate_high: 0.02
    fallback_areas: ["Real estate & leases", "Utilities & facility energy"]

# Stage evidence (src/pipeline/checks.py): how a budget year's stage was confirmed against DBM's budget books.
stage_evidence:
  min_exact_share: 0.6         # of the programs compared with DBM's printed actuals, at least this share must match to the dollar

# Duplicate and split payment screen (sql/mart/47-49, docs/models/payment_screen.md). Leads to review, not errors.
# The payments dataset (7syw-q4cy) is one row per paying agency x payee name x ZIP x fiscal year, and its date column is a
# record date (Jan 1 of a year), not a payment date: the windows below can only be applied at that grain (see the model notes).
payment_screen:
  first_fy: 2022               # screened years (full payment years only; the partial latest year is never screened)
  last_fy: 2026
  min_amount: 1000             # duplicates: each line at least this many dollars (and positive)
  duplicate_window_days: 7     # duplicates: same agency, vendor and exact amount with record dates this close
  split_window_days: 14        # splits: 2+ payments to one vendor by one agency within this many days ...
  # ... each under the small-procurement limit in force on the record date, together above it. Primary source: Md. Code, State
  # Finance and Procurement Art. 13-109(a)(1) ("a unit spends $50,000 or less"), raised to $100,000 by Ch. 161 of the Acts
  # of 2023 (HB 543), effective Oct 1, 2023: https://mgaleg.maryland.gov/2023RS/chapters_noln/Ch_161_hb0543T.pdf
  # (accessed 2026-11-10). COMAR 21.05.07 (small procurement procedures) applies the statutory limit; its regs.maryland.gov
  # page could not be fetched from the build environment. DGS/DOT construction limits ((a)(3), $200,000) are not modeled.
  small_procurement_threshold: 100000          # SF&P 13-109(a)(1) as amended by Ch. 161 of 2023, from the effective date below
  small_procurement_threshold_before: 50000    # SF&P 13-109(a)(1) before Oct 1, 2023
  small_procurement_effective: "2023-10-01"    # Ch. 161 of 2023, section 2
  small_procurement_source: "Md. Code SF&P 13-109(a)(1); Ch. 161 of 2023 (HB 543), effective 2023-10-01; accessed 2026-11-10"
  transaction_grain_min_dates: 24      # the split rule runs only when a screened year has at least this many distinct dates (payment-level data); otherwise "not measurable"
  excluded_payee_types: [Government, Health care organization, Financial institution]   # transfers to government, benefits/health plans, debt service (reference/payee_type_rules.csv)
  exclude_payee_pattern: "CLERK OF|ATTORNEY GENERAL|CIRCUIT COURT|DISTRICT COURT|PAYROLL|RETIREMENT|PENSION|UNEMPLOYMENT|CHILD SUPPORT|INTERNAL REVENUE|\\bIRS\\b|FICA|DEFERRED COMP|BENEFIT"   # payroll-like and benefit payees, matched on the normalized payee name
  org_name_pattern: "\\b(INC|LLC|L L C|CORP|CORPORATION|CO|COMPANY|LTD|LP|LLP|PC|PA|PLLC|GROUP|ASSOCIATES|SERVICES|SYSTEMS|SOLUTIONS|TECHNOLOGIES|ENTERPRISES|INTERNATIONAL|PARTNERS|HOLDINGS|AUTHORITY|FOUNDATION|ASSOCIATION|JOINT VENTURE|JV|USA|AMERICA|CENTER|INSTITUTE|UNIVERSITY|COLLEGE)\\b"   # a "Business or other" payee is named only if its name looks like an organization; others may be individuals and are never shown by name
  # Confidence of each lead (sql/mart/48), rules fixed before the leads were measured (docs/models/payment_screen.md):
  # score = +1 amount not a multiple of round_cents_low; -1 amount a multiple of round_unit; +1 every record paid by one
  # paying unit; -1 records paid by different paying units; -1 the same agency, vendor and amount in another screened year
  # (a recurring contract or grant); -1 amount under small_amount; -1 a Non-profit payee (grants come in equal installments).
  # high = score >= high_min, low = score <= low_max, else medium.
  confidence:
    round_unit: 1000
    round_cents_low: 100       # an amount with cents or single dollars (not a multiple of $100) is "not round"
    small_amount: 5000
    high_min: 1
    low_max: -1
  # Evidence-based review (sql/mart/48), from the data only (no invoices are visible, so never "confirmed overpayment"):
  # confirmed_duplicate_in_source = the records are identical in every published field (same paying unit and its code,
  # payee name and ZIP); likely_legitimate = different paying units and the payee got this exact amount from at least
  # pattern_min_units paying units that year (a sponsorship or fee schedule); needs_records otherwise; unreviewed = a rule the
  # review does not cover (split purchases).
  review:
    pattern_min_units: 3
  lever:                       # Calculator lever "Payment recovery review (leads)": flagged review dollars x the measured confirmation rate
    fy: 2026                   # flagged dollars of this payments year
    # The rates are derived in sql/mart/49 from the review: measured rate = confirmed / reviewed leads, low/high its Wilson
    # 95% interval (z below). When the review confirms none (it cannot without payment records), the rate is NULL and the
    # lever is unmeasured_rate with the label below; the old 2%/5%/10% placeholders are retired.
    z: 1.96
    unmeasured_rate: 0
    unmeasured_basis: "not measurable without payment records"
# Data-publication issues found by the payment screen and verified at the source (sql/mart/50_d_source_issues.sql).
source_issues:
  verified_ids: [SRC-2022-J11, SRC-2022-U10]   # issues checked against the published source (docs/reconciliation/crosschecks_2026-11-10.csv)
  verified_on: "2026-11-10"
  verified_against: "opendata.maryland.gov 7syw-q4cy (SoQL count and sum by fiscal_year, date, agency_name) and vendorpayments.maryland.gov api/opex/totals.json?year=2022 ($36,656,748,837.50, which includes the second block)"
  verified_amount: 874477234.00                 # dollars of the FY2022 rows dated Jan 1, 2023 at the source (both agencies)
  status_verified: "In published source (both State sites); ask the Comptroller's open-data team which FY2022 block is current"
  status_unverified: "Found in the extract; not yet checked against the source"

# ======================================================================================================================
# ML layer (src/models/payee_classifier.py, src/models/grant_groups.py; docs/models/payee_classifier.md, grant_groups.md).
# These produce leads and better labels, never savings. Every threshold below was set before the results were looked at.
# ======================================================================================================================
payee_classifier:
  random_state: 20261110        # fixed seed: the evaluation sample and the model are reproducible
  eval_size: 400                # names in the hand-labeled evaluation set (reference/payee_labels_sample.csv)
  spend_buckets: [0, 100000, 1000000, 10000000, 100000000]   # lower edges of the all-years spend buckets (dollars)
  ngram_range: [2, 5]           # TF-IDF character n-grams (char_wb), lengths 2 to 5
  max_features: 200000
  C: 4.0                        # logistic regression inverse regularization
  review_threshold: 0.6         # a model label below this probability goes to the review queue (review_flag)
  # rule label (reference/payee_type_rules.csv) -> classifier class
  rule_to_class:
    Government: government
    Non-profit: nonprofit
    Business or other: business
    Financial institution: business
    Utility: business
    Health care organization: other
    Education institution: other
grant_groups:
  model: sentence-transformers/all-MiniLM-L6-v2   # falls back to TF-IDF word unigrams+bigrams when it cannot be loaded
  cosine_threshold: 0.85        # agglomerative clustering (average linkage): descriptions closer than this join a group; set before looking
  sensitivity: [0.80, 0.90]     # thresholds reported alongside, never used for the leads
  lead_fy: 2025                 # overlap leads: groups funded by 2+ grantor agencies in this same fiscal year (the grants data ends FY2025);
                                # the looser any-year reading is reported as multi_agency_any_year (grantor names resolved through reference/grantor_agency_aliases.csv)
  min_agencies: 2
  top_n_check: 20               # groups hand-checked in docs/models/grant_groups.md (by lead_fy dollars)
